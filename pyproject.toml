[project]
name = "uplift-pipeline"
version = "0.1.0"
description = "Automated Uplift Modeling Pipeline with Airflow and MLflow"
readme = "README.md"
authors = [
    { name = "jd", email = "juandsep@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "xgboost>=2.0.0",
    "causalml>=0.15.0",
    "mlflow>=2.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "duckdb>=1.5.5",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
