# Airflow 3 on one machine: LocalExecutor (tasks run inside the scheduler
# container) and a Postgres metadata DB. No Celery, no Redis, no triggerer
# (the DAG has no deferrable tasks). Secrets come from airflow/.env, see
# .env.example. Start: docker compose -f airflow/docker-compose.yml up -d

x-airflow: &airflow
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: uplift-airflow:local
  # Match the host user on Linux so bind-mounted data/ stays writable.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Concurrent task processes; 8 lets all feature shards run at once.
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-8}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?set in airflow/.env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in airflow/.env}
    # Every component must share these, or task tokens and sessions fail.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in airflow/.env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set in airflow/.env}
    AIRFLOW__API__WORKERS: 1
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    UPLIFT_DATA_DIR: /opt/airflow/data
    UPLIFT_NUM_SHARDS: ${UPLIFT_NUM_SHARDS:-8}
    UPLIFT_MAX_PARALLEL_SHARDS: ${UPLIFT_MAX_PARALLEL_SHARDS:-8}
    UPLIFT_SHARD_THREADS: ${UPLIFT_SHARD_THREADS:-2}
    # Without a server, runs land in a SQLite store on the data volume.
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////opt/airflow/data/mlflow.db}
    MLFLOW_TRACKING_TOKEN: ${MLFLOW_TRACKING_TOKEN:-}
    MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-uplift}
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - ${UPLIFT_DATA_HOST_DIR:-../data}:/opt/airflow/data
    # Shared so the API server reads task logs from disk, no log server hop.
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in airflow/.env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: db migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    # SimpleAuthManager keeps passwords in a JSON file; write it from .env
    # instead of letting Airflow generate one and print it to the log.
    command:
      - bash
      - -c
      - |
        set -e
        python -c 'import json, os; print(json.dumps({"admin": os.environ["AIRFLOW_ADMIN_PASSWORD"]}))' \
          > "$$AIRFLOW_HOME/simple_auth_manager_passwords.json.generated"
        exec airflow api-server
    environment:
      <<: *env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in airflow/.env}
    # Localhost only: on a VM, reach it through an SSH tunnel or IAP.
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 10s
      retries: 10
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

volumes:
  postgres-data:
  airflow-logs:
