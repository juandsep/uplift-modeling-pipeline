# Local monitoring: the API image serving a downloaded model, Prometheus,
# a Pushgateway for the batch drift job, and Grafana with the dashboard
# provisioned from this folder. Costs nothing: it all runs on this machine.
# Start: monitoring/fetch_model.sh && docker compose -f monitoring/docker-compose.yml up -d --build

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: uplift-api:local
    environment:
      # An absolute path is immutable, so it counts as pinned.
      MODEL_URI: /model
      API_KEY: ${API_KEY:-local-key}
    volumes:
      - ./model:/model:ro
    ports:
      - "8000:8080"

  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.7.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      # Local only: open without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
