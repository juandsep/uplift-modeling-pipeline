name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation, no service account keys.

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/uplift-api:${{ github.sha }}

jobs:
  deploy:
    # Skip until the GCP repository variables exist (see README).
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # Requires a protected environment with required reviewers configured in
    # the repository settings, so main is never shipped unattended.
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A half-configured repository must fail loudly, not deploy a service
      # that refuses every prediction: MODEL_VERSION empty means the API serves
      # nothing (see config.assert_model_uri_is_pinned).
      - name: Check the required repository variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MODEL_VERSION: ${{ vars.MODEL_VERSION }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPO GCP_WIF_PROVIDER \
                      GCP_DEPLOY_SA GCP_RUNTIME_SA MLFLOW_TRACKING_URI MODEL_VERSION; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable $name is empty; set it before deploying"
              missing=1
            fi
          done
          exit $missing

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}

      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: uplift-api
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # Cap the fan-out: the API has no rate limiting of its own.
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --max-instances=10
          env_vars: |
            MLFLOW_TRACKING_URI=${{ vars.MLFLOW_TRACKING_URI }}
            MODEL_VERSION=${{ vars.MODEL_VERSION }}
          secrets: |
            API_KEY=uplift-api-key:latest
