name: Deploy

on:
  push:
    # dev deploys to staging on every merge; main deploys to production after
    # a reviewer approves the environment.
    branches: [dev, main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation, no service account keys.

env:
  STAGING: ${{ github.ref == 'refs/heads/dev' }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/uplift-api:${{ github.sha }}

jobs:
  deploy:
    # Skip until the GCP repository variables exist (see README).
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # production requires a reviewer (repository settings), so main is never
    # shipped unattended. MODEL_VERSION is set per environment.
    environment: ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A half-configured repository must fail loudly, not deploy a service
      # that refuses every prediction: MODEL_VERSION empty means the API serves
      # nothing (see config.assert_model_uri_is_pinned).
      - name: Check the required variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MODEL_VERSION: ${{ vars.MODEL_VERSION }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPO GCP_WIF_PROVIDER \
                      GCP_DEPLOY_SA GCP_RUNTIME_SA MLFLOW_TRACKING_URI MODEL_VERSION; do
            if [ -z "${!name}" ]; then
              echo "::error::variable $name is empty; set it before deploying"
              missing=1
            fi
          done
          exit $missing

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}

      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.STAGING == 'true' && 'uplift-api-staging' || 'uplift-api' }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # Cap the fan-out: with RATE_LIMIT_RPS per instance this bounds total load.
          # Scales to zero; staging gets a smaller cap. The model loads at
          # instance start: the startup probe holds traffic until /ready (up to
          # 240s), and CPU boost speeds up the load.
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --memory=1Gi
            --cpu-boost
            --startup-probe=httpGet.path=/ready,periodSeconds=10,timeoutSeconds=5,failureThreshold=24
            --min-instances=0
            --max-instances=${{ env.STAGING == 'true' && '2' || '10' }}
          env_vars: |
            MLFLOW_TRACKING_URI=${{ vars.MLFLOW_TRACKING_URI }}
            MODEL_VERSION=${{ vars.MODEL_VERSION }}
          secrets: |
            API_KEY=${{ env.STAGING == 'true' && 'uplift-api-key-staging' || 'uplift-api-key' }}:latest
